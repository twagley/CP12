			1. 	Include a whole bunch of images in the body:
			
					<img src="http://drapak.ca/cpg/img/marioMap.png">
					<img src="http://drapak.ca/cpg/img/marioBadGuy.png">
				 
			2. 	Add IDs to them:
			
					<img id="backgroundId" src="http://drapak.ca/cpg/img/marioMap.png">
					<img id="badGuyId" src="http://drapak.ca/cpg/img/marioBadGuy.png">
				 
			3. 	Use CSS in the style block to position them:
			
					#rockId {
						position: 	absolute;
						top: 		15px;
						left: 		130px;
					}
				
			4. 	Use CSS to define your animation keyframes:
			
					@keyframes badGuyAnimation {
						0% {
							top: 	0px;
							left: 	0px;
						}
						50% {
							top: 	100px;
							left: 	0px;
						}
						100% {
							top: 	100px;
							left: 	100px;
						}
					}
				
			5. 	Then use CSS to apply that animation to that Id:
			
					#badGuyId {
						animation-name: 			badGuyAnimation;
						animation-duration: 		9s;
						animation-iteration-count: 	infinite;
						animation-timing-function: 	ease;
					}
