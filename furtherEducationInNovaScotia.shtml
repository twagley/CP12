						+ "<p><strong>Location: </strong>"

						+ "</p>"
						+ ""

					// loop through each program 
					for (thisProgram in programs) {
						courseHTML = courseHTML
							+ "<div>"
							+ "<h4><a href='"
							+ programs[ thisProgram ].site
							+ "'>"
							+ programs[ thisProgram ].name
							+ "</a></h4><p class='indent'>"
							+ programs[ thisProgram ].description
							+ "<br /><br /><strong>Requirements: </strong>"
							+ programs[ thisProgram ].requirements
							+ "<br /><strong>Length of program: </strong>"
							+ programs[ thisProgram ].fullOrPart
							+ " &ndash; "
							+ programs[ thisProgram ].programLength
							+ "</p></div>"
					
					} 
					
					courseHTML = courseHTML
						+ ""
				}
