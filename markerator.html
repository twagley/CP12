	<body>
		<!-- INTERFACE -->
		
		<h2>Project evaluator for Computer Programming</h2>
		<p>
			This works on projects up to and including: 
			<span id="lastProjectId">Exam</span>
		</p>

		<div id="fileUploadId">
			<p>Upload your file here:</p>
			
			<table>
				<tbody><tr>
					<th>
						<code>.html</code>:
					</th>
					<td>
						<input id="htmlFileId" class="fileInputClass" type="file" placeholder="HTMLFilename">
					</td>
					<td>
						— your main program file
					</td>
					
				</tr>
			</tbody></table>
		</div>
		

		<h2>Assignment:</h2>
		<div id="assignmentId"></div>
		
		<div id="criteriaMatchingId">
			<h2>Criteria matching:</h2>
			<div id="outputId"></div>
		</div>

		<div id="programCodeId">
			<hr>
			<h2>Program code:</h2>
			<pre><code id="linesId"></code></pre>
		</div>
		<!--	
------------STYLE GUIDE FOR LONG LINES: DO NOT PASS COLUMN 95 -------------------------------|			
		-->
 		<script>

		
			// fileTransfer OBJECT
			// 
			//	properties:	
			//		fileTransfer.jsonString
			//
			//	methods:
			//		fileTransfer.uploadJSONFileInto( 
			//	
			//		fileTransfer.insertDownloadLink( 
			//			
			//		fileTransfer.displayJSON();
			//
            var fileTransfer = {
				SANITY_CHECK:		true,	// display tables for sanity checks of data
                jsonString:     	"",
				rawContents:		"",
				fileContents:		"",
				filename:			"",
				projectNumber:		-1,
				lineArr:			[],
				debug:				false,
				
				projectObj:			{},		// the big object that defines the assignment
			
              
				//INPUT: read in the text data inside the file
				readFile: function ( uploadEvent, callbackFunction ) {
					// only process the first file that was uploaded
    				var firstFile = uploadEvent.target.files[0];
					// create a new file reader object to process the contents				
    				var reader = new FileReader();
					// start reading in the file as text					
    				reader.readAsText( firstFile );							
    				
					// define what to do when the file is finished being read in...
    				reader.onload = function( uploadEvent ) { 
						if ( fileTransfer.debug )
						// send file info to the console
    					console.log( 											 
							"Got the file.\n" 
							+ "name: " + firstFile.name + "\n"
							+ "type: " + firstFile.type + "\n"
							+ "size: " + firstFile.size + " bytes\n"
    					);  
    					
						//store the filename and mime type
						this.filename		= firstFile.name;
						this.mime			= firstFile.type;
						
						//OUTPUT: set the title to the file name
						document.title		= this.filename;
						
						// store the contents from the file
						this.rawContents	= uploadEvent.target.result;
						
						// convert the line breaks to unix first
						this.fileContents	= this.rawContents.replace( /\r\n/g, '\n' );
						this.fileContents	= this.fileContents.replace( /\r/g, '\n' );
						// split the file into the individual lines
						this.lineArr	= this.fileContents.split( '\n' );
						
						// add the filename in front so the line numbering starts with 1
						this.lineArr.unshift( "FILENAME: " + firstFile.name );
						
						// trigger the callback function when complete
						callbackFunction();								
    				}.bind( this );
				},
				
				
				//PROCESS: this determines which assignment this is depending on the 
				//			filename uploaded
				determineAssignmentNumber: function () {
					if ( this.debug ) console.log( 'in determineAssignmentNumber...' );
					
					//INIT: set up a variable flag for whether the assignment has been found
					var hasAssignmentBeenFound	= false;
					
					//LOOP: through each of the projects
					for ( projectIndex in PROJECT_ARR ) {
						var expectedFilename	= PROJECT_ARR[ projectIndex ].filename;
						
						//PROCESS: break the expected filename into the front and back part
						var filePartArr			= expectedFilename.split( 'LastName' );
						
						//PROCESS: check if this filename matches the expected filename
						var frontFilenameRegExp	= new RegExp('^' + filePartArr[0]);
						var backFilenameRegExp	= new RegExp(filePartArr[1] + '$');
						
						if ( this.filename.match( frontFilenameRegExp ) ) {
							if ( this.filename.match( backFilenameRegExp ) ) {
								if ( this.debug ) console.log( 'matched an assignment: '  + projectIndex );
								
								hasAssignmentBeenFound	= true;
								
								this.projectNumber	= projectIndex;
								
								//store the assignment object in this.
								this.projectObj = PROJECT_ARR[ projectIndex ];
								
								//OUTPUT: display the assignment information
								outputAssignmentInformation( this.projectNumber )
								
								//OUTPUT: hide the upload form
								document.getElementById( 'fileUploadId' ).style.display 
									= 'none';
							}
						}						
					}
					
					//IF: there has not been a match
					if ( hasAssignmentBeenFound == false ) {
						//OUTPUT: display a message that we cannot detect a a projectIndex
						document.getElementById( 'assignmentId' ).innerHTML
							= "<h3>Can't match your assignment file</h3>"
							+ "<p>This either because you have saved your file"
							+ " with the incorrect filename, " 
							+ " or because I have not updated this program"
							+ " with the assignment requirements.</p>";
					}
				},
			}
			
			
			
			//OUTPUT: display the assignment information
			const outputAssignmentInformation = function ( projectNumber ) {
				if ( this.debug ) console.log( "in outputAssignmentInformation..." );
				
				//INIT: create a variable of convenience for the evaluationObj
				const evaluationObj = fileTransfer.projectObj.evaluationObj;
				
				//INIT: create a variable to hold the HTML code for a table
				var tableHTML	= "<table><thead><tr><th></th></tr></thead><tbody>";
				
				//INIT: set the text label used for reference pages
				const referencePage	= "reference";
				
				
				//PROCESS: add any STYLE criteria
				if ( 'styleArr' in evaluationObj ) {
					var evaluationMessage	= "";
					
					//IF: there is an evaluationMessageObj.styleArr
					if ( fileTransfer.projectObj.evaluationMessageObj ) {
						if ( fileTransfer.projectObj.evaluationMessageObj.styleArr ) {
							evaluationMessage	
								= "<br>" 
								+ fileTransfer.projectObj.evaluationMessageObj.styleArr;
						}
					}
					
					//add a descriptive header
					tableHTML	
						+= "<tr>"
						+  "	<th></th>"
						+  "	<th>Criteria met?</th>"
						+  "	<th>Line number</th>"
						+  "	<th>STYLE Criteria" 
						+ 			evaluationMessage

			//PROCESS: find a tag
			const findTag = function ( HTMLCSSObj ) {
				if ( this.debug ) {
					console.log( 'in findTag...' );
					console.log( '...beginning: ' + HTMLCSSObj.begin );
					console.log( '...ending: ' + HTMLCSSObj.end );
					console.log( 'HTMLCSSObj=', HTMLCSSObj );				
				}
				
				//INIT: create the array of successful searches
				var resultsArr = [];
				
				
				//TODO: limit mathy lines by using /^((?![<][/]).)*$/gm to remove </ lines
				
				//IF: there is a beginning defined
				if ( 'begin' in HTMLCSSObj ) {
					//LOOP: through each of the lines in the file...
					for ( startIndex in fileTransfer.lineArr ) {
						//IF: this line matches the search
						if ( fileTransfer.lineArr[ startIndex ].match( HTMLCSSObj.begin ) ) {
							if ( this .debug ) console.log( 'start of match: ' + startIndex );
							
							//IF: there is an end defined
							if ( 'end' in HTMLCSSObj ) {
								//now find the end of the tag...
								//LOOP: through the remainder of the lines
								for ( 
									endIndex = startIndex; 
									endIndex < fileTransfer.lineArr.length; 
									endIndex ++ 
								) {
									
									//IF: there is a match of the end of the search...
									if ( 
										fileTransfer.lineArr[ endIndex ].match( 
											HTMLCSSObj.end 
										) 
									) {
										if ( this.debug ) console.log( 'end of match: ' + endIndex );	
										
										//store the results into the results array
										resultsArr.push( 
											{ 
												begin: parseInt( startIndex ), 
												end: parseInt( endIndex ) 
											} 
										);
										
										//restart the search for the next open tag 
										//to after the close tag
										startIndex	= endIndex;
										break;
									}
								}
							//ELSE: there is not end defined - a one line command
							} else {
								//store the results into the results array
								resultsArr.push( { begin: parseInt( startIndex ) } );
							}
						}
					}
				}
				
				return resultsArr;
			}
			
			
			
			//PROCESS:
			const convertCodeToDisplayableHTML = function ( inputText ) {
				if ( this.debug ) console.log( "inputText: " + inputText ); 
				
				var lineLength = inputText.length;
				
				//now find long lines...
				if ( lineLength > 96 )  {
					inputText 
						= inputText.substring(96, 0).replace( /</g, '&lt;')
						+ "<span class='lineBreakClass'>||</span>"
						+ inputText.substring(1000, 96).replace( /</g, '&lt;')
						+ "\n";			
						
				//ELSE: just print out the normal line
				} else {
					inputText	= inputText.replace( /</g, '&lt;');
				}
				
				return inputText;
			}

						criteriaArr.push( 'process' + criteriaIndex );					
					}
				}
				
				//IF: there are STRUCTURE criteria...
				if ( 'structureArr' in evaluationObj ) {
					//LOOP: through each part of the processArr
					for ( criteriaIndex in evaluationObj.structureArr ) {
						criteriaArr.push( 'structure' + criteriaIndex );					
					}
				}
				
				//IF: there are OUTPUT criteria...
				if ( 'outputArr' in evaluationObj ) {
					//LOOP: through each part of the outputArr
					for ( criteriaIndex in evaluationObj.outputArr ) {
						criteriaArr.push( 'output' + criteriaIndex );					
					}
				}
				
				//now search for the current criteriaId
				//LOOP: through each of the criteriaIds
				for ( criteriaIndex in criteriaArr ) {
					//IF: this criteria is the same as criteriaId
					if ( criteriaId === criteriaArr[ criteriaIndex ] ) {
						
						// hide the current preview block
						document.getElementById( 
							'preview' + criteriaArr[ criteriaIndex ] + "Id"
						).style.display	= 'none';
						
						//IF: this is not the end of the criteriaArr
						if ( criteriaIndex < ( criteriaArr.length - 1 ) ) {
							// display the next block
							document.getElementById( 
								'preview' 
								+ criteriaArr[ parseInt( criteriaIndex ) + 1 ] 
								+ "Id"
							).style.display	= 'block';

							// scroll back to the top of criteria
							document.getElementById( 'criteriaMatchingId' ).scrollIntoView();

						//ELSE: this is the end!						
						} else {
							//display the code block
							document.getElementById( 'linesId' ).style.display	= 'block';
							// hide the criteria matching block
							document.getElementById( 'criteriaMatchingId' ).style.display
								= 'none';
							//trigger the print dialogue
							window.print();
						}
					}
				}
			}
			
			
			
			//PROCESS: check for long lines
			const checkForLongLines = function () {
				if ( this.debug ) console.log( 'in checkForLongLines...' );

				//INIT: create an array for long lines
				var longLineArr	= [];
				
				//LOOP: through each of the lines
				for ( lineIndex in fileTransfer.lineArr ) {
					//INIT: create a variable of convenience for this line
					var line	= fileTransfer.lineArr[ lineIndex ];
					
					//IF: there are more than 96 lines, then process the line
					if ( line.length > 96 ) {
						//add the long line
						
						longLineArr.push( 
							{
								begin:	lineIndex,
								line:	line
							}
						);					
					}
				}
				
				return longLineArr;
			}
			
			
			
			//OUTPUT: display the evaluationObj
			const displayEvaluationObj = function ( criteriaObj, criteriaId ) {
				if ( this.debug ) {
					console.log( 'in displayEvaluationObj...' );
					console.log( 'criteriaObj=', criteriaObj );
					console.log( 'criteriaId=', criteriaId );				
				}
				
				var referenceText	= "";
				var exampleText		= "";
				var codeLines		= "";
				var negativeText	
					= "<h4 class='criteriaCodeClass'>" 
					+ "Use the checkboxes on correct examples of code.</h4>";
				var negativeClass	= "";
				var isNegative		= false; 
				
				//IF: there is a reference in the object
				if ( 'reference' in criteriaObj ) {
					referenceText
						= "<p><strong>Reference:</strong> <a href='"
						+ criteriaObj.reference.pageURL
						+ "' target='_blank'>" 
						+ criteriaObj.reference.pageName
						+ "</a></p>"
				}
				
				//IF: there is an example
				if ( 'example' in criteriaObj ) {
					exampleText = convertCodeToDisplayableHTML( criteriaObj.example );
				}

				//IF: the hunting is negative
				if ( criteriaObj.negative ) {
					if ( criteriaObj.negative == true ) {
						negativeClass = " negativeClass ";
						negativeText 
							= "<h4 class='" 
							+ negativeClass 
							+ "'>Use the checkboxes on INCORRECT examples of code.</h4>";
						isNegative	= true;
					} else {
					
					}
				} else {
				
				}
				
				//PROCESS: join together the criteria info
				var outputHTML 
					= "<hr><h3>"
					+ criteriaObj.question
					+ "</h3>"
					+ "<div class='exampleIndentClass'>"
					+ referenceText
					+ "<h4><code>Code example:</code></h4>"
					+ "<pre class='exampleClass'><code>"
					+ exampleText
					+ "</code></pre>"
					+ negativeText;
					
				//INIT: create a variable to store the resultsArr of matching lines
				var resultsArr	= [];
				
				//IF: this criteriaObj is for longLines
				if ( criteriaObj.name == 'longLines' ) {
					resultsArr	= checkForLongLines();
					
				//ELSE: treat it as a normal criteria
				} else {
					//get an array of lines for this tag
					resultsArr	= findTag( criteriaObj );
				}

				
				//IF: there are no results
				if ( resultsArr == undefined ) {
					codeLines	= "<p>I can't find an example of this in the program.</p>";
		
				//ELSE: add the lines of code into the outputHTML
				} else {
					codeLines	= "<h4>Your code:</h4>";
					
					//LOOP: through each member of resultsArr
					for ( resultsIndex in resultsArr ) {
						//IF: this result has both a beginning and an end
						if ( 'end' in resultsArr[ resultsIndex ] ) {

							//LOOP: through from begin to end
							for ( 
								lineIndex = resultsArr[ resultsIndex ].begin;
								lineIndex <= resultsArr[ resultsIndex ].end; 
								lineIndex++ 
							) {
								//add this line to the codeLines
								codeLines
									+= '<input type="checkbox" id="' 
									+ criteriaObj.criteria
									+ '_'
									+ lineIndex
									+ 'Id" value="' +	criteriaObj.criteria 
									+ '" onclick="addCriteriaLine( this, ' 
									+ isNegative 
									+ ' );">&nbsp;' 
									+ "<strong>"
									+ lineIndex
									+ "</strong>: "
									+ convertCodeToDisplayableHTML(
										fileTransfer.lineArr[ lineIndex ]
									)
									+ "\n";
							}
							
						//ELSE: just add the single line
						} else {
							//IF: there exists .line alternative for long lines
							if ( resultsArr[ resultsIndex ].line )  {
								codeLines
									+= '<input type="checkbox" id="' 
									+ criteriaObj.criteria
									+ '_'
									+ resultsArr[ resultsIndex].begin
									+ 'Id" value="' +	criteriaObj.criteria
 									+ '" onclick="addCriteriaLine( this, ' 
									+ isNegative 
									+ ' );">&nbsp;' 
									+ "<strong>"
									+ resultsArr[ resultsIndex].begin
									+ "</strong>: "
									+ convertCodeToDisplayableHTML(
										resultsArr[ resultsIndex].line.substring(96, 0)
									  )
									+ "<span class='lineBreakClass'>||</span>"
									+ convertCodeToDisplayableHTML(
										resultsArr[ resultsIndex].line.substring(1000, 96)
 									  )
									+ "\n";			
									
							//ELSE: just print out the normal line
							} else {
								codeLines
									+= '<input type="checkbox" id="' 
									+ criteriaObj.criteria
									+ '_'
									+ resultsArr[ resultsIndex].begin
									+ 'Id" value="' +	criteriaObj.criteria 
									+ '" onclick="addCriteriaLine( this, ' 
									+ isNegative 
									+ ' );">&nbsp;' 
									+ "<strong>"
									+ resultsArr[ resultsIndex].begin
									+ "</strong>: "
									+ convertCodeToDisplayableHTML(
										fileTransfer.lineArr[ resultsArr[ resultsIndex ].begin ]
									)
									+ "\n";
							}
						}
					}
				}

				//OUTPUT: add this text to the outputId
				document.getElementById( 'outputId' ).innerHTML	
					+= "<div class='criteriaPreviewClass' id='preview" 
					+ criteriaId
					+ "Id'>" 
					+ 	outputHTML 
					+ 	"<pre><code>"
					+ 	codeLines
					+ 	"</code></pre>"
					+ 	"<p>"
					+ 		"<button onclick='updateCriteria(\"" 
					+ 			criteriaId 
					+ 			"\", 0);'>Yes, this IS done correctly!</button>"
					+		" &mdash; "
					+ 		"<button onclick='updateCriteria(\"" 
					+ 			criteriaId 
					+ 			"\", 1);'>Partially correct" 
					+ 		"</button>"
					+		" &mdash; "
					+ 		"<button onclick='updateCriteria(\"" 
					+ 			criteriaId 
					+ 			"\", 2);'>No</button>" 
					+ 	"</p>"
					+ "</div></div>";
			}
			
			
			//PROCESS/OUTPUT: remove criteria for this line
			const removeCriteriaLine = function ( element, isNegative ) {
				if ( this.debug ) console.log( 'in removeCriteriaLine...' );
				 
				var criteria	= element.getAttribute( 'value' );
				const id		= element.getAttribute( 'id' );				
				const idArr		= id.split( '_' );
				var line		= idArr[ 1 ].replace( 'Id', '' );
				var lineString	= line;
				
				//clean up the line list
				
				//INPUT: read in the current list of lines
				var lineList	= document.getElementById( criteria + 'LineId' ).innerHTML;
				
				//PROCESS: remove the current line
				lineString		= lineList.replace( lineString + ' ', '' );
				
				//OUTPUT: this line number to the criteria label
				document.getElementById( criteria + 'LineId' ).innerHTML = lineString;				
				
				// now clean up the criteria
				
				//INPUT: read in the current list of criteria
				var criteriaList	
					= document.getElementById( 'criteriaCodeLine' + line + 'Id' ).innerHTML;
				
				//PROCESS: remove the current line
				criteria = criteriaList.replace( criteria + ' ', '' );				
				
				//OUTPUT: the criteria code to the line listing
				document.getElementById( 'criteriaCodeLine' + line + 'Id' ).innerHTML 
					= criteria;
					
					
				//OUTPUT: change the click action for this element
				element.onclick = '';
				element.addEventListener( 
					'click', 
					function () {
						addCriteriaLine( element, isNegative );
					} 
				);
				
			}
			
			
			
			//PROCESS/OUTPUT: this adds the criteria to the line listing
			const addCriteriaLine = function ( element, isNegative ) {
				if ( this.debug ) {
					console.log( 'in addCriteriaLine...' );
					console.log( 'element: ', element );
				}
				 
				var criteria	= element.getAttribute( 'value' );
				const id		= element.getAttribute( 'id' );				
				const idArr		= id.split( '_' );
				var line		= idArr[ 1 ].replace( 'Id', '' );
				var lineString	= line;
				
				
				
				//IF: this is a negative criteria...
				if ( isNegative == true ) {
					criteria	
						= "<span class='negativeClass'>"
						+ criteria
						+ "</span>";
						
					lineString
						= "<span class='negativeClass'>"
						+ lineString
						+ "</span>";
				}
				
				
				//OUTPUT: change the click action for this element
				element.onclick = '';
				element.addEventListener( 
					'click', 
					function () {
						removeCriteriaLine( element, isNegative );
					} 
				);
				
				//OUTPUT: the criteria code to the line listing
				document.getElementById( 'criteriaCodeLine' + line + 'Id' ).innerHTML 
					+= criteria + ' ';
				
				//OUTPUT: this line number to the criteria label
				document.getElementById( criteria + 'LineId' ).innerHTML += lineString + " ";				
				
			}
			
			//INPUT: when a file has been entered into the file upload input

						fileTransfer.determineAssignmentNumber();

						for ( lineIndex in fileTransfer.lineArr ) {
							codeLines
								+= "<span class='criteriaCodeClass' id='criteriaCodeLine" 
								+ lineIndex 
								+ "Id'></span>&nbsp;"

								+ lineIndex
								+ "</strong>: "
								+ convertCodeToDisplayableHTML(
									fileTransfer.lineArr[ lineIndex ]
								)
								+ "\n";

						document.getElementById( 'linesId' ).innerHTML = codeLines;

							for ( criteriaIndex in evaluationObj.initArr ) {

						}

						if ( 'inputArr' in evaluationObj) {

							for ( criteriaIndex in evaluationObj.inputArr ) {

									'input' + criteriaIndex
								);
							}

						if ( 'processArr' in evaluationObj) {

							for ( criteriaIndex in evaluationObj.structureArr ) {

							for ( criteriaIndex in evaluationObj.outputArr ) {

			document.body.onload	= function () {
				if ( fileTransfer.debug ) console.log( 'finished loading...' );

				const lastProjectName = PROJECT_ARR[ PROJECT_ARR.length - 1 ].title;

		</script>
