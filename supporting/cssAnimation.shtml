<head>
	<style>
		@keyframes helloAnimation {
			0% {
				color: blue;
				top: 0px;
				left: 0px;
				opacity: 0;
			}
			25% {
				color: red;
				top: 200px;
				left: 0px;
				opacity: 0.5;
			}
			50% {
				color: green;
				top: 200px;
				left: 200px;
				opacity: 1;
			}
			75% {
				color: orange;
				top: 0px;
				left: 200px;
				opacity: 0.5;
			}
			100% {
				color: blue;
				top: 0px;
				left: 0px;
				opacity: 0;
			}
		}
	
		#animateID {
			font-size:					40px;
			position: 					fixed;
			animation-name: 			helloAnimation;
			animation-duration: 		6s;
			animation-iteration-count: 	infinite;
			animation-timing-function: 	ease;
		}
	</style>
<head>

<body>
	<h3 id="animateID">Hello CSS Animation!</h3>
</body>
