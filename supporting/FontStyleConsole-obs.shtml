		<h1>2.04: Hand-in: Font style console</h1><p>Please enter the text to be styled:<br/><textarea id="inputTextID"onchange="updateText();">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut consequat feugiat ante quis tempor. Proin malesuada augue eget metus lacinia, id accumsan risus rutrum. Donec sodales velit et est fringilla venenatis. Cum sociis natoque penatibus et magnis dis parturient montes, nascetur ridiculus mus. Nulla quis egestas nunc. Donec volutpat enim in elementum scelerisque. Pellentesque et sem quis nulla imperdiet ornare. Integer id iaculis mi. Quisque tincidunt porttitor dui, sit amet rutrum ligula placerat vitae. Morbi laoreet risus quam, a gravida est rutrum vitae.</textarea><br/><button onclick="updateText();">Update the text</button></p><hr/><table><thead></thead><tbody><tr><th>weight: </th><td><button id="boldID"onclick="makeBold();">bold</button><button onclick="makeNormalWeight();">normal</button></td></tr><tr><th>style: </th><td><button id="italicID"onclick="makeItalic();">italic</button><button onclick="makeNormalStyle();">normal</button></td></tr><tr><th>border: </th><td><button id="borderID"onclick="makeBlackBorder();">1px solid black</button><button onclick="makeNoBorder();">border: none</button></td></tr><tr><th>background: </th><td><button id="pinkBackgroundID"onclick="makePinkBackground();">pink</button><button onclick="makeWhiteBackground();">white</button></td></tr><tr><th>color: </th><td><input id="colorInputID"onchange="updateTextColor();"value="black"/><button id="colorInputButton"onclick="updateTextColor();">Update text color</button></td></tr><tr><th>size: </th><td><input id="fontSizeInputID"onchange="updateFontSize();"value="16"/><button id="reduceFontSizeButton"onclick="reduceFontSize();">-10</button><button id="increaseFontSizeButton"onclick="increaseFontSize();">+10</button><button onclick="updateFontSize();">Update font size</button></td></tr></tbody></table><div id="outputID"></div>
