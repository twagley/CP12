            var SCREEN_SCALE_FACTOR = window.innerWidth / 105;


            var mainProcedure = function () {
                cities = createBlankDivs ( cities );
                outputCities( cities );
            }
            
            //PROCESS: take in the star data and create the HTML
            // code for all the star divs
            var createBlankDivs = function ( cities ) {

                for ( i in cities ) {
					var width = 2;
					var radius = 1;
					var grey = 255;
					cities[ i ].div 
						= "<div id='city"
						+ i
						+ "ID' style='color: white; background-color: rgb("
						+ grey
						+ ","
						+ grey
						+ ","
						+ 255
						+ "); top: "
						+ convertLatitudeToTop( cities[i].latitude, width )
						+ "; left: "
						+ convertLongitudeToLeft( cities[i].longitude, width )
						+ "; width: "
						+ width
						+ "px; height: "
						+ width
						+ "px; border-radius: "
						+ radius
						+ "px;' " 
						+ 'title="gotime '
                        + cities[i].gotime
						+ ": "
                        + cities[i].location
                        + " type: "
						+ cities[i].stopType
						+ " latitude: "
						+ cities[i].latitude
						+ " longitude: "
						+ cities[i].longitude
						+ '"></div>';
                }
                return cities;              
            }
       
				
				

            //PROCESS: convert the declination to top coordinate
            //  percent = 100 - (max - value)/(max - min ) * 100
			// 
            var convertLatitudeToTop = function ( latitude, width ) {
				var topPercentage = 100 - ((latitude - 44.47878703) / 0.425036868 * 100);
                var top =  Math.round( (topPercentage * SCREEN_SCALE_FACTOR) - ( width / 2 ) )  + "px";
                //console.log('top' + top);
                return top;
            }

            //PROCESS: convert the declination to top coordinate
            //  percent = 100 - (max - value)/(max - min ) * 100
            var convertLongitudeToLeft = function ( longitude, width ) {
				var leftPercentage = ((longitude + 63.85857282) / 0.602672692 * 100);	
                var left = Math.round( (SCREEN_SCALE_FACTOR * leftPercentage) - ( width / 2 ) )+ "px";
                //console.log('left:' + left );
                return left;
            }
                       
            //OUTPUT: output the table into the #outputID <div>
            var outputCities = function ( cities ) {
				var codeLump ="";
				
				for (i in cities) {
					codeLump = codeLump + cities[ i ].div;
				}
                document.getElementById('outputID').innerHTML = codeLump;
            }
