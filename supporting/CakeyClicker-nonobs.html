	<body>
		<!-- The assignment: Create a page that uses Javascript to make a simple clicking game

			1.	Place instructions

			___/10 PROCESS: including:

				[ ]	using basic math
				[ ]	using parseInt()
				
			___/10 OUTPUT: including ANY FOUR of the following:
				[ ]	changing the color or background using Javascript

------------STYLE GUIDE FOR LONG LINES: DO NOT PASS COLUMN 95 -------------------------------|
		-->
		
		<h1>2.04: Hand-in: Cakey Clicker</h1>
		
		<div id="listID">
			<ol>
				<li>Name yourself</li>
				<li>Get clicking!</li>
				<li>Enjoy superstardom!</li>
			</ol>
		</div>

		<table>
			<thead>
			</thead>
			<tbody>
				<tr>
					<td>Name</td>
					<th id="nameDisplayID">
						<input type="text" id="nameInputID" value="AnonymousClikker"><br>
						<button type="button" id="buttonID">Name yourself!</button>
					</th>
				</tr>
				<tr>
					<td>Score</td>
					<th id="scoreID">0</th>
				</tr>
			</tbody>
		</table>
		
		
		
		<img
			id="cakeID"
			src="./img/cake.svg">

		
 		<script>
			// display changes to the cake and score
			var cakeyClick = function () {
				console.log( 'in cakeyClick...' );
				
				//INPUT: read the current score
				var score	= document.getElementById('scoreID').innerHTML;
				
				
				//PROCESS: calculate the new score
				score		= parseInt( score ) + 100;
				
				//PROCESS: calculate the new width of the cake
				var newWidth	= 100 + (score / 10 );
				
				//PROCESS: calculate the new size of the score text
				var scoreSize	= 14 + (score / 300 );
				
				//PROCESS: calculate the new size of the score text
				var opacity		= 0.2 + (score / 10000 );

				
				//OUTPUT: display new score
				document.getElementById('scoreID').innerHTML			= score;
				document.getElementById('scoreID').style.fontSize		= scoreSize + 'px';
				document.getElementById('nameDisplayID').style.fontSize	= scoreSize + 'px';
				document.getElementById('scoreID').style.color			= 'blue';
				document.getElementById('scoreID').style.opacity		= opacity;
				
				//OUTPUT: increase the current width of the cake
				document.getElementById('cakeID').style.width	= newWidth + 'px';
			}
			
			
			//OUTPUT: display the name entered in #nameDisplayID
			var displayName = function () {
				console.log( 'in displayName...' );
				
				// display the name
				document.getElementById("nameDisplayID").innerHTML
					= document.getElementById("nameInputID").value;
					
				// change the background of the page
				document.body.style.backgroundColor	= "yellow";
				
				// change the text in the list
				document.getElementById("listID").innerHTML
					= "<h2>Go!!!!!!!</h2>";		
					
				//INPUT: attach cakeyClick to any click on the body of the page
				document.onclick 								= cakeyClick;
			}
			
			
			//INPUT: attach displayName to any changes in #nameInputID
			document.getElementById('nameInputID').onchange	= displayName;
			//INPUT: attach displayName to any clicks on #buttonID
			document.getElementById('buttonID').onclick 	= displayName;
		</script>
	</body>
</html>
