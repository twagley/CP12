			function mainProcedure () {	// triggered by a button click
				console.log("in mainProcedure...");
				
				var mazeCode	= createMazeCode( mazeArr );
				outputMazeCode( mazeCode );
			}
			
			function createMazeCode( mazeArr ) { //PROCESS: This uses a nested loop through each elements of mazeCell 
				console.log("in createMazeCode..." + mazeArr);

				var mazeCode = "<!--woot-->";
			
				//loop through each row of the array...
				for (row in mazeArr) {
					console.log( 'row=' + row );
					var rowArr = mazeArr[ row ];
					
					//loop through each column of the array
					for (column in mazeArr[ row ]) {
						var imgCode ="";
						if (mazeArr[ row ][ column ] == 0 ) {
							imgCode = "https://www.kasandbox.org/programming-images/cute/StoneBlock.png"
						} else {
							imgCode = "https://www.kasandbox.org/programming-images/cute/GrassBlock.png"
						}

					mazeCode = mazeCode
						+ "<img "
						+ " src='"
						+ imgCode
						+ "'"
						+ " style='top: "
						+ row * 25
						+ "px; left: "
						+ column * 30
						+ "px;' "
						+ "/>"
					}
				}
				return mazeCode;
			}
			
			function outputMazeCode ( htmlCode ) {  //OUTPUT: this puts the table information inside the table labelled "tableID"
				console.log( "in outputMazeCode..." + htmlCode );
				
				document.getElementById("outputID").innerHTML	=htmlCode;
			}
