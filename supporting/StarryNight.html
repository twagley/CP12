<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Live example: Reading the mouse position</title>
        <script>
            var mouse = {
				// current top and left position of the mouse
				// in pixels
				top: 0, 
				left: 0, 
				
				// array with the list of possible star images in it
				sourceArr: [
					"https://upload.wikimedia.org/wikipedia/commons/b/b1/Silver_star.png",
					"https://upload.wikimedia.org/wikipedia/commons/d/d5/Award_star_(gold).png",
					"http://orig05.deviantart.net/1ef9/f/2014/059/4/b/pink_star_with_gold_trim_png_by_clipartcotttage-d78ehbp.png",
					"http://drapak.ca/cpg/img/shuriken-153172_640.png", //https://pixabay.com/static/uploads/photo/2013/07/12/18/16/shuriken-153172_640.png
					"https://farm5.staticflickr.com/4139/4760235618_1a32440153_o_d.png",

					"https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Star_Ouro.svg/2000px-Star_Ouro.svg.png",
					"https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Star_full.svg/2000px-Star_full.svg.png",
					"https://upload.wikimedia.org/wikipedia/commons/3/32/Hielo.png",
					"http://drapak.ca/cpg/img/shooting-star-297130_640.png", //https://pixabay.com/static/uploads/photo/2014/03/25/16/27/shooting-star-297130_640.png
					"https://www.kasandbox.org/programming-images/cute/Star.png"
				],

				// make the current image be the ninth element of the source array
				currentSrc: "https://www.kasandbox.org/programming-images/cute/Star.png",
				
				// changes the current image internally and then outputs it
				changeImage: function ( imageIndex ) {
					//console.log('in mouse.changeImage: imageIndex=' + imageIndex );
					this.currentSrc 						= this.sourceArr[ imageIndex ];
					document.getElementById('imageID').src 	= this.currentSrc;
				},
				
				// get the current position returned by the mouse event
				getCurrentPosition: function ( event ) {
					//console.log( 'in mouse.getCurrentPosition...' );
					this.top    = event.clientY;
					this.left   = event.clientX;
				},

				// display the current mouse position
				displayPosition: function () {
					//console.log( 'in mouse.displayPosition...' );

					document.getElementById('topID').innerHTML 	= this.top;
					document.getElementById('leftID').innerHTML	= this.left;
				},

				// move the star to the current mouse position
				moveImage: function () {
					//console.log( 'in mouse.moveImage...' );
				
					var imageStyle 	= document.getElementById('imageID').style;
					imageStyle.top 	= this.top + 'px';
					imageStyle.left	= this.left + 'px';
				},

				// add a new image to the outputID
				placeImage: function () {
					//console.log( 'in mouse.placeImage...' );

					var newImage 		= document.createElement("img");
					newImage.src 		= this.currentSrc ;
					newImage.style.top 	= this.top + 'px';
					newImage.style.left	= this.left + 'px';
					
					document.getElementById( 'outputID' ).appendChild( newImage );
				},
				
				// loop through the sourceArr images and place each one inside the correct ID
				placeKeyMenuImages: function () {
					
					for ( i in this.sourceArr ) {
						var newImage 		= document.createElement("img");
						newImage.src 		= this.sourceArr[ i ] ;						
						document.getElementById( 'image' + i + 'ID' ).appendChild( newImage );
					}
				}
            }

            // whenever the mouse moves...        
            document.onmousemove = function ( event ) {
                mouse.getCurrentPosition( event );
				mouse.displayPosition();
				mouse.moveImage();
            }
			
            // whenever the mouse clicks
            document.onmousedown = function () {
				if ( mouse.top > 50 ) {
					mouse.placeImage();
				}
            }
			
			// whenever the keyboard is triggered 
			window.onkeydown    = function ( keyEvent ) {
				//INPUT: read which character was pressed...
				var characterPressed    = keyEvent.which || keyEvent.keyCode;   
				
				if ( characterPressed == 48 ) { 		// key pressed is '0'
					mouse.changeImage( 0 );
				} else if ( characterPressed == 49 ) {	// key pressed is '1'
					mouse.changeImage( 1 );
				} else if ( characterPressed == 50 ) {	// key pressed is '2'
					mouse.changeImage( 2 );
				} else if ( characterPressed == 51 ) {	// key pressed is '3'
					mouse.changeImage( 3 );
				} else if ( characterPressed == 52 ) {	// key pressed is '4'
					mouse.changeImage( 4 );
				} else if ( characterPressed == 53 ) {	// key pressed is '5'
					mouse.changeImage( 5 );
				} else if ( characterPressed == 54 ) {	// key pressed is '6'
					mouse.changeImage( 6 );
				} else if ( characterPressed == 55 ) {	// key pressed is '7'
					mouse.changeImage( 7 );
				} else if ( characterPressed == 56 ) {	// key pressed is '8'
					mouse.changeImage( 8 );
				} else if ( characterPressed == 57 ) {	// key pressed is '9'
					mouse.changeImage( 9 );
				} 
			}
        </script>
        <style>
			body {
				background-image: url("http://drapak.ca/art10/arthistory/images/Van_Gogh_-_The_Starry_Night.jpg");
				color: white;
				font-weight: bold;
			}
            img {
                position: absolute;
            }
			img, td { 
				width: 50px;
			}
			.withborder {
				border: 1px solid grey;
			}
        </style>
    </head>
    <body onload="mouse.placeKeyMenuImages();">
		<table>
			<thead>
				<tr>
					<th>Top</th>
					<th>Left</th>
					<th>Key pressed:</th>

					<th>0</th>
					<th>1</th>
					<th>2</th>
					<th>3</th>
					<th>4</th>

					<th>5</th>
					<th>6</th>
					<th>7</th>
					<th>8</th>
					<th>9</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td id="topID"></td>
					<td id="leftID"></td>
					<td></td>
					
					<td id="image0ID"></td>
					<td id="image1ID"></td>
					<td id="image2ID"></td>
					<td id="image3ID"></td>
					<td id="image4ID"></td>

					<td id="image5ID"></td>
					<td id="image6ID"></td>
					<td id="image7ID"></td>
					<td id="image8ID"></td>
					<td id="image9ID"></td>
				</tr>
			</tbody>
		</table>
        <div id="outputID"></div>
        <img id="imageID" src="https://www.kasandbox.org/programming-images/cute/Star.png" />
    </body>
</html>
