<!doctype html>
<html>
	<head>
		<title>Travel and Find Things</title>

		<meta name="author" content="EDIT: LastName">
		<meta charset="UTF-8">
		
		<!--This draws a maze, and puts a link character on top of the maze, 
			it to move around using the keyboard
			
			Created:	18. November -  
		-->
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js"></script>
		<script>
			var ROW_HEIGHT		= 40;
			var COLUMN_WIDTH 	= 50;
			
			var maze = {
				// INIT: initialize the array that holds the map pattern

				imageSourceArr: [	"http://drapak.ca/cpg/img/BrownBlock.png",
									"http://drapak.ca/cpg/img/DirtBlock.png",
									"http://drapak.ca/cpg/img/GrassBlock.png",
									"http://drapak.ca/cpg/img/PlainBlock.png",
									"http://drapak.ca/cpg/img/RoofSouth.png",
									"http://drapak.ca/cpg/img/StoneBlock.png",
									"http://drapak.ca/cpg/img/WaterBlock.png",
									"http://drapak.ca/cpg/img/WoodBlock.png",
									"http://drapak.ca/cpg/img/WallBlock.png",
									"http://drapak.ca/cpg/img/TreeUgly.png"
				],
				
				contents: 	[	[6,6,6,6,6,6,6,6,6,6,null,null,null,null,null,null],
								[6,1,6,1,1,1,1,1,1,6,null,null,null,null,null,null],
								[6,1,6,1,6,6,1,1,1,6,null,null,null,null,null,null],
								[6,1,1,1,1,6,1,1,1,6,null,null,null,null,null,null],
								[6,6,6,6,1,6,6,6,1,6,null,null,null,null,null,null],
								[6,1,1,1,1,1,1,1,1,6,null,null,null,null,null,null],
								[6,1,6,6,6,6,6,6,6,6,null,null,null,null,null,null],
								[6,1,1,1,1,1,1,1,6,6,null,null,null,null,null,null],
								[6,6,6,6,6,6,6,1,1,6,null,null,null,null,null,null],
								[6,6,6,6,6,6,6,6,1,6,null,null,null,null,null,null],
								[6,6,6,6,6,6,6,6,6,6,null,null,null,null,null,null],
				],

				mazeCode:	"",
				
				//generate the maze html and then display it
				display:	function () {
					var mazeCode	= this.createMazeCode( );
					this.outputMazeCode( mazeCode );	
				},
				
				//PROCESS: This uses a nested loop through each elements of mazeCell 
				createMazeCode:		function () {
					console.log("in createMazeCode...");

					this.mazeCode = "<!--woot-->";
				
					//loop through each row of the array...
					for ( row in this.contents ) {
						console.log( 'row=' + row );
						var rowArr = this.contents[ row ];
						
						//loop through each column of the array
						for (column in this.contents[ row ]) {

							//check the inside of this cell in the array
							if (this.contents[ row ][ column ] == null ) {
								// do nothing
							} else {
								// add this image 
								this.mazeCode = this.mazeCode
									+ "<img "
									+ " src='"
									+ this.imageSourceArr[ this.contents[ row ][ column ] ]
									+ "'"
									+ " style='top: "
									+ row * ROW_HEIGHT
									+ "px; left: "
									+ column * COLUMN_WIDTH
									+ "px; width: "
									+ COLUMN_WIDTH
									+ "px;' "
									+ "/>"
							}
						}
					}
				},
			
				//OUTPUT: this puts the table information inside the table labelled "tableID"
				outputMazeCode:		 function ( ) {  
					console.log( "in outputMazeCode..." );
					document.getElementById("mazeID").innerHTML	=this.mazeCode;
				}
				
			};
			
			var prize = {
				// INIT: initialize the array that holds the map pattern

				imageSourceArr: [	"http://drapak.ca/cpg/img/BrownBlock.png",
									"https://www.kasandbox.org/programming-images/cute/Heart.png",
									"https://www.kasandbox.org/programming-images/cute/Star.png",
									"http://drapak.ca/cpg/img/PlainBlock.png",
									"http://drapak.ca/cpg/img/RoofSouth.png",
									"http://drapak.ca/cpg/img/StoneBlock.png",
									"http://drapak.ca/cpg/img/WaterBlock.png",
									"http://drapak.ca/cpg/img/WoodBlock.png",
									"http://drapak.ca/cpg/img/WallBlock.png",
									"http://drapak.ca/cpg/img/TreeUgly.png"
				],
				
				contents: 	[	[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
								[null,null,null,1,null,null,null,null,null,null,null,null,null,null,null,null],
								[null,null,null,null,null,null,null,2,null,null,null,null,null,null,null,null],
								[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
								[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
								[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
								[null,2,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
								[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
								[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
								[null,null,null,null,null,null,null,null,1,null,null,null,null,null,null,null],
								[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null],
				],

				mazeCode:	"",
				
				//generate the maze html and then display it
				display:	function () {
					var mazeCode	= this.createMazeCode( );
					this.outputMazeCode( mazeCode );	
				},
				
				//PROCESS: This uses a nested loop through each elements of mazeCell 
				createMazeCode:		function () {
					console.log("in createMazeCode...");

					this.mazeCode = "<!--woot-->";
				
					//loop through each row of the array...
					for ( row in this.contents ) {
						console.log( 'row=' + row );
						var rowArr = this.contents[ row ];
						
						//loop through each column of the array
						for (column in this.contents[ row ]) {

							//check the inside of this cell in the array
							if (this.contents[ row ][ column ] == null ) {
								// do nothing
							} else {
								// add this image 
								this.mazeCode = this.mazeCode
									+ "<img id='prize" + row + "-" + column +"ID' "
									+ " src='"
									+ this.imageSourceArr[ this.contents[ row ][ column ] ]
									+ "'"
									+ " style='top: "
									+ (( row * ROW_HEIGHT ) - 29 )
									+ "px; left: "
									+ column * COLUMN_WIDTH
									+ "px; width: "
									+ COLUMN_WIDTH
									+ "px;' "
									+ "/>"
							}
						}
					}
				},
			
				//OUTPUT: this puts the table information inside the table labelled "tableID"
				outputMazeCode:		 function ( ) {  
					console.log( "in outputMazeCode..." );
					document.getElementById("prizeID").innerHTML	=this.mazeCode;
				},
				
				//OUTPUT: fade this image away and remove it from the array
				fadeAndRemove: function ( row, column ) {
					$("#prize" + row + "-" + column + "ID" ).animate( 
						{ opacity: 0 }, 
						{ duration: 500 } 
					);
					// remove this prize from the array
					this.contents[ row ][ column ] = null;
				}
				
			};
			
			var link = {
				id:				"linkID",
				src:			"http://drapak.ca/cpg/img/link-down.png",
				width:			( COLUMN_WIDTH - 14 ) + "px",
				row:			1,
				column:			1,
				duration:		500,
				score:			0,
				
				//OUTPUT: display link
				//		set the opacity of link to 0
				//		set the correct width
				//		link it to an image 
				//		fade in to full opacity
				display:	function () {
					document.getElementById(this.id).style.opacity	= 0;
					document.getElementById(this.id).style.width	= this.width;
					document.getElementById(this.id).src			= this.src;
					$("#" + this.id ).animate( { opacity: 1 }, this.duration );
				},	
				
				//OUTPUT: beep!
				beep: function () {
					document.getElementById("audioBeepID").play();
				},
				
				//OUTPUT: change the row position and then animate to there
				goUp:		function () {
					//add the image change to the animation queue
					$("#" + this.id ).animate( 
						{ margin: 0 }, 
						{ duration: 1, complete: function () {
							document.getElementById( this.id ).src = "http://drapak.ca/cpg/img/link-up.png";
							} 
						} 
					);
					
					if ( maze.contents[ this.row - 1 ][ this.column ] == 1 ) { //if there is space to move ahead...
						this.row = this.row - 1;
						this.animate();					
					}
				},
				
				//OUTPUT: change the row position and then animate to there
				goDown:		function () {
					//add the image change to the animation queue
					$("#" + this.id ).animate( 
						{ margin: 0 }, 
						{ duration: 1, complete: function () {
							document.getElementById( this.id ).src = "http://drapak.ca/cpg/img/link-down.png";
							} 
						} 
					);
					
					if ( maze.contents[ this.row + 1 ][ this.column ] == 1 ) { //if there is space to move ahead...
						this.row = this.row + 1;
						this.animate();
					}
				},
				
				//OUTPUT: change the column position and then animate to there
				goLeft:		function () {
					//add the image change to the animation queue
					$("#" + this.id ).animate( 
						{ margin: 0 }, 
						{ duration: 1, complete: function () {
							document.getElementById( this.id ).src = "http://drapak.ca/cpg/img/link-left.png";
							} 
						} 
					);
					
					if ( maze.contents[ this.row ][ this.column - 1 ] == 1 ) { //if there is space to move ahead...
						this.column = this.column - 1;
						this.animate();
					}
				},
				
				//OUTPUT: change the column position and then animate to there
				goRight:		function () {
					//add the image change to the animation queue
					$("#" + this.id ).animate( 
						{ margin: 0 }, 
						{ duration: 1, complete: function () {
							document.getElementById( this.id ).src = "http://drapak.ca/cpg/img/link-right.png";
							} 
						} 
					);
					if ( maze.contents[ this.row ][ this.column + 1 ] == 1 ) { //if there is space to move ahead...
						this.column = this.column + 1;
						this.animate();
					}
				},
				
				//OUTPUT: animate to the row and column position
				animate:	function( ) {
					
					$("#" + this.id ).animate( { 
						top: 		( this.row * ROW_HEIGHT + 2 ) 		+ "px",
						left: 		( this.column * COLUMN_WIDTH + 7 )  + "px"
						}, {
						duration: 	this.duration, 
						easing: 	"linear"});
						
						
					if ( prize.contents[ this.row ][ this.column ] == 2 ) { //if on top of a star...
						this.score = this.score + 500;		//add some points
						link.duration = link.duration / 2;	//speed up
						prize.fadeAndRemove( this.row, this.column );
					} else if ( prize.contents[ this.row ][ this.column ] == 1 ) {//if on top of a heart
						this.score = this.score + 5000;		//add some points
						prize.fadeAndRemove( this.row, this.column );
					}

					document.getElementById('rowID').innerHTML 		= this.row;
					document.getElementById('columnID').innerHTML 	= this.column;
					document.getElementById('scoreID').innerHTML 	= this.score;
				}
			};

			
			function mainProcedure () {	// triggered by a button click
				console.log("in mainProcedure...");
				
				maze.display();
				prize.display();
				link.display();
				link.animate();
			}
			
			
			//	INPUT: This next command tells the browser to trigger when a key is pressed anywhere
			window.onkeydown	=function (keyEvent) {	
				//	detect the code of the key pressed, regardless of IE/Firefox/Chrome...
				var characterPressed	=keyEvent.which || keyEvent.keyCode;
				
				if (characterPressed == 38) { // UP key is pressed
					link.goUp();
					
				} else if (characterPressed == 40) { // DOWN key is pressed
					link.goDown();
					
				} else if (characterPressed == 39) { // RIGHT key is pressed
					link.goRight();
					
				} else if (characterPressed == 37) { // LEFT key is pressed
					link.goLeft();
				} 
			}
		</script>
		
		<style>
			img {
				position: 		fixed;
			}
			#linkID {
				top: 			50%;
				left: 			50%;
			}
			#coordinatesID {
				position:		fixed;
				top:			20px;
				left:			50px;
				font-family: 	sans-serif;
				font-weight:	bold;
				color:			white;
			}
			
		</style>
	</head>

	<body>	
		<h1>Travel and Find Things</h1>
		
		<div id="mazeID"></div>
		<div id="prizeID"></div>
		<img id="linkID"></img>
		<div id="coordinatesID">
			Score: <span id="scoreID"></span>
			Row: <span id="rowID"></span>
			Column: <span id="columnID"></span>
		</div>
		<p>
			<button onclick="mainProcedure();">Click to create the playing field!</button><br />		
		</p>
		 <audio id="audioBeepID">
            <source src="http://drapak.ca/cpg/beep.mp3" type="audio/mpeg">
        </audio>
	</body>
</html>
